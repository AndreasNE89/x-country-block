<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Tamis app icon master (128 artboard, 112 px tile). A round sieve drawn as five feed rows; the marigold row is the one you keep. Generated by scripts/render-brand.mjs. -->
  <defs>
    <linearGradient id="tamis-tile" x1="0" y1="8" x2="0" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33959A"/>
      <stop offset="1" stop-color="#1C676D"/>
    </linearGradient>
    <clipPath id="tamis-disc"><circle cx="64" cy="64" r="35"/></clipPath>
  </defs>
  <rect x="8" y="10" width="112" height="112" rx="26" fill="#0B3336" fill-opacity=".16"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tamis-tile)"/>
  <rect x="8.75" y="8.75" width="110.5" height="110.5" rx="25.25" fill="none" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1.5"/>
  <g clip-path="url(#tamis-disc)">
    <rect x="0" y="29" width="128" height="10" fill="#FFFFFF"/>
    <rect x="0" y="44" width="128" height="10" fill="#FFFFFF"/>
    <rect x="0" y="59" width="128" height="10" fill="#FFB638"/>
    <rect x="0" y="74" width="128" height="10" fill="#FFFFFF"/>
    <rect x="0" y="89" width="128" height="10" fill="#FFFFFF"/>
  </g>
</svg>
